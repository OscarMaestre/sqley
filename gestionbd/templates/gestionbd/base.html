<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
    <style type="text/css">
       div.container{
        font-size: 1.5rem;
        margin:50px;
        padding:100px;
        background-color: rgb(240,240,230);
        font-family:Verdana, Geneva, Tahoma, sans-serif;
       }
       table{
        width: 100%;
       }
       input[type="text"]{
        width: 80ch ;
       }
       form th {
        text-align: right;
       }
       .success{
        background-color:limegreen;
       }
       .error{
        background-color:orangered;
        color:white;
       }
    </style>
    <title>Legislación</title>
</head>

<body>

<div class="container">
{% if messages %}
    <div class="container mt-3">
    {% for message in messages %}
     <div class='{{message.tags}}'>{{message}}</div>
    {%endfor%}
{%endif%}
{%block contenido%}
{%endblock%}
</div>

</body>
</html>
